openapi: 3.1.0
info:
  title: TextMeFlow API
  version: "0.1.0"
  summary: Self-hosted WhatsApp messaging API for the Fades Management product family.
  description: |
    TextMeFlow is a drop-in replacement for TextMeBot, plus a modern REST API.

    ## Authentication
    All `/v1/*` endpoints (except `POST /v1/accounts` and the Stripe webhook)
    require a Bearer token:
    ```
    Authorization: Bearer tmf_<your_api_key>
    ```

    The legacy `GET /send.php` endpoint accepts the api key as the
    `?apikey=…` query parameter for TextMeBot drop-in compatibility.

    ## Connecting a plugin ("Connect with TextMeFlow")
    Plugins never ask the user to copy an API key. Instead (see
    `docs/connect-contract.md`):

    1. Send the browser to
       `https://textmeflow.eu/connect?app=<slug>&site=<https://shop>&return=<callback>&state=<random ≥16 chars>&locale=<nl|en|fr|de>`.
       The user signs up or signs in and clicks **Allow**; the browser comes
       back to `return?code=…&state=…` (or `return?error=access_denied&state=…`).
       OAuth2 clients (Zapier) may use `client_id` for `app` and
       `redirect_uri` for `return`; without `site`, the origin of `return` is shown.
       `return` must be https (http only for `localhost`).
    2. Exchange the code server-to-server with `POST /v1/connect/token`
       (valid 10 minutes, single use, bound to `return`).
    3. Use the returned `tmfc_…` connection token as Bearer everywhere the
       API accepts one. Each token can be disconnected separately — by the
       plugin (`DELETE /v1/connect/token`) or by the customer in the portal
       under "Connected apps".
servers:
  - url: https://api.textmeflow.eu
    description: Production
  - url: http://localhost:3000
    description: Local

tags:
  - name: Compat
    description: TextMeBot drop-in compatibility endpoints.
  - name: Accounts
    description: Account, plan and pairing flows.
  - name: Messages
    description: Send + status of outbound messages.
  - name: Webhooks
    description: Inbound webhooks from Stripe (incoming) and customer-facing inbound-message webhooks (outgoing).
  - name: Connect
    description: Plugin connection flow ("Connect with TextMeFlow") — code exchange and disconnect.
  - name: Admin
    description: Super-admin (HTTP Basic auth).

paths:
  /healthz:
    get:
      summary: Liveness probe.
      tags: []
      responses:
        "200": { description: ok }

  /send.php:
    get:
      tags: [Compat]
      summary: TextMeBot drop-in send.
      description: |
        Mirrors `https://api.textmebot.com/send.php`. Returns an HTML body
        containing `Result: <b>Success</b>` or `Result: <b>Failed</b>`.
        Existing BedFlow code that does substring-matching on that string
        keeps working unmodified.
      parameters:
        - in: query
          name: recipient
          required: true
          schema: { type: string, example: "+32472932208" }
        - in: query
          name: apikey
          required: true
          schema: { type: string }
        - in: query
          name: text
          required: true
          schema: { type: string }
      responses:
        "200":
          description: TextMeBot-formatted plain-HTML body.
          content:
            text/html:
              schema: { type: string }

  /v1/accounts:
    post:
      tags: [Accounts]
      summary: Register a new account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, plan_code]
              properties:
                email: { type: string, format: email }
                plan_code:
                  type: string
                  enum: [free, starter, pro, business, enterprise]
                interval:
                  type: string
                  enum: [monthly, yearly]
                  default: monthly
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id: { type: string, format: uuid }
                  api_key: { type: string }
                  plan: { type: string }
                  checkout_url:
                    type: [string, "null"]
                    description: Present for paid plans, null for free.
                  trial_ends_at: { type: [string, "null"], format: date-time }

  /v1/accounts/me:
    get:
      tags: [Accounts]
      summary: Current account profile + usage.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Account data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string, format: email }
                  plan:
                    type: object
                    properties:
                      code: { type: string }
                      name: { type: string }
                      monthly_quota: { type: [integer, "null"] }
                      devices: { type: [integer, "null"] }
                  plan_code: { type: string, example: free }
                  usage:
                    type: object
                    properties:
                      period_start: { type: string, format: date }
                      messages_sent: { type: integer }
                      messages_remaining: { type: [integer, "null"] }
                  status: { type: string, enum: [active, suspended, cancelled, past_due] }
                  risk_score: { type: number }
                  trial_ends_at: { type: [string, "null"], format: date-time }
                  wa_sessions:
                    type: array
                    description: Pending and connected WhatsApp numbers, in send-priority order.
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        status: { type: string, enum: [pending, connected] }
                        phone_number: { type: [string, "null"], example: "+32470123456" }

  /v1/accounts/me/pair:
    post:
      tags: [Accounts]
      summary: Start a pairing flow (QR, optionally with a pairing code).
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                phone:
                  type: string
                  description: |
                    Optional E.164 number of the WhatsApp account to link.
                    When given, the response also carries an 8-character
                    `pairing_code` to enter in WhatsApp > Linked devices >
                    Link a device > "Link with phone number instead".
                  example: "+32470123456"
      responses:
        "201":
          description: |
            Returns `qr_png_b64` (data URI) + `pair_id`. Poll
            `/v1/accounts/me/pair/{pair_id}` to see when WhatsApp
            confirms the link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pair_id: { type: string, format: uuid }
                  wa_session_id: { type: string, format: uuid }
                  status: { type: string, enum: [pending, pending_no_qr_yet] }
                  qr_png_b64: { type: [string, "null"] }
                  expires_at: { type: string, format: date-time }
                  pairing_code:
                    type: [string, "null"]
                    description: Only present when `phone` was sent. Null when the code could not be issued.
                    example: "ABCD-1234"
                  pairing_code_error:
                    type: string
                    description: Only present when `pairing_code` is null; retry via `/v1/accounts/me/pair/{pair_id}/code`.
                    enum: [invalid_phone, session_not_pending, already_registered, socket_not_ready, pairing_failed, worker_unavailable]
        "403": { description: "`device_limit_reached`" }
        "422": { description: "`invalid_phone` (no session is created)" }

  /v1/accounts/me/pair/{pair_id}:
    get:
      tags: [Accounts]
      summary: Poll the pairing status.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: pair_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: pending | connected | expired | failed

  /v1/accounts/me/pair/{pair_id}/code:
    post:
      tags: [Accounts]
      summary: Get a pairing code for a pending pairing (alternative to the QR).
      description: |
        Issues the 8-character code for WhatsApp > Settings > Linked devices >
        Link a device > "Link with phone number instead". Asking again for
        the same number returns the same code. Keep polling
        `/v1/accounts/me/pair/{pair_id}` for the status. Rate limit: 10/min.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: pair_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "+32470123456" }
      responses:
        "200":
          description: Code issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pair_id: { type: string, format: uuid }
                  status: { type: string, enum: [pending] }
                  pairing_code: { type: string, example: "ABCD-1234" }
                  expires_at: { type: string, format: date-time }
        "404": { description: "`not_found` — unknown pair for this account" }
        "409": { description: "`pair_not_pending` (expired/connected), `session_not_pending` or `already_registered`" }
        "422": { description: "`invalid_phone`" }
        "429": { description: Too many requests. }
        "502": { description: "`pairing_failed` — WhatsApp refused the request" }
        "503": { description: "`socket_not_ready` or `worker_unavailable` — retry in a few seconds" }

  /v1/accounts/me/session:
    delete:
      tags: [Accounts]
      summary: Log out of WhatsApp Web on this account.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Disconnected. }

  /v1/accounts/me/billing-portal:
    get:
      tags: [Accounts]
      summary: Stripe customer-portal URL for self-service.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Portal URL.

  /v1/messages:
    post:
      tags: [Messages]
      summary: Queue an outbound message.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, text]
              properties:
                to:
                  type: string
                  description: E.164 phone number (must start with `+`).
                  example: "+32472932208"
                text: { type: string }
                media_url: { type: string, format: uri }
                urgent:
                  type: boolean
                  description: Bypass quiet-hours shaping. Use sparingly.
                  default: false
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id: { type: string, format: uuid }
                  status: { type: string, enum: [queued] }
        "429":
          description: Quota or rate limit exceeded.

  /v1/messages/{id}:
    get:
      tags: [Messages]
      summary: Fetch a message by id.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Message record.

  /v1/connect/token:
    post:
      tags: [Connect]
      summary: Exchange a one-time /connect code for a connection token.
      description: |
        Server-to-server, no Bearer. JSON or form-encoded. `redirect_uri`
        is accepted as an alias of `return` (OAuth2 clients such as Zapier;
        `grant_type`, `client_id` and `client_secret` are ignored). The code
        is valid for 10 minutes, works once and only together with the exact
        `return` URL it was issued for. Reconnecting the same app on the same
        site replaces the previous token (its webhooks move to the new token).
        Rate-limited to 20 requests per minute per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectTokenRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/ConnectTokenRequest' }
      responses:
        "200":
          description: Connection token issued.
          content:
            application/json:
              schema:
                type: object
                required: [token, access_token, token_type, account_email, plan, connected_numbers]
                properties:
                  token: { type: string, example: "tmfc_9f2Kx0aZ1bQ7…", description: "`tmfc_` + 40 characters. Store it server-side, never show it in a browser." }
                  access_token: { type: string, description: Same value as `token` (OAuth2 name). Does not expire. }
                  token_type: { type: string, enum: [Bearer] }
                  account_email: { type: string, format: email }
                  plan: { type: string, example: free }
                  connected_numbers: { type: integer, description: Number of connected WhatsApp numbers. }
        "400":
          description: "`invalid_code` (unknown, expired, already used or different return URL) or `invalid_request` (code/return missing)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [invalid_code, invalid_request] }
        "429":
          description: Too many attempts.
    delete:
      tags: [Connect]
      summary: Disconnect — revoke the connection token used as Bearer.
      description: |
        Must be called with the connection token itself (`tmfc_…`). Webhooks
        registered with this token are removed too. The account API key
        cannot be revoked here.
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Revoked.
        "400":
          description: "`not_a_connection_token` — the Bearer was the account API key."
        "401":
          description: Missing, unknown or already revoked token.

  /v1/webhooks:
    get:
      tags: [Webhooks]
      summary: List per-app webhooks.
      description: |
        With a connection token: only the webhooks registered with that
        token. With the account API key: all webhooks of the account.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Registered webhooks (without secrets).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookSubscription' }
    post:
      tags: [Webhooks]
      summary: Register a webhook (e.g. a Zapier/n8n/Make trigger).
      description: |
        In addition to the account-wide webhook URL from the portal. Incoming
        WhatsApp messages (not the ones the account sent itself) are POSTed
        to this URL with the same `InboundMessage` payload, headers and retry
        policy, signed (`X-TextMeFlow-Signature: sha256=<hmac>`) with the
        `secret` returned here — it is shown only once. Max 10 per account.
        A webhook registered with a connection token is removed when that
        token is revoked.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, description: Must be https. }
                event: { type: string, enum: [message.inbound], default: message.inbound }
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WebhookSubscription'
                  - type: object
                    properties:
                      secret: { type: string, description: 64 hex characters, HMAC-SHA256 key. Shown only once. }
        "409":
          description: "`webhook_limit_reached` (with `limit`)."
        "422":
          description: "`invalid_url` (not an https URL) or `invalid_event`."

  /v1/webhooks/{id}:
    delete:
      tags: [Webhooks]
      summary: Remove a per-app webhook.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Removed.
        "404":
          description: Unknown, or not visible with this token.

  /v1/webhooks/stripe:
    post:
      tags: [Webhooks]
      summary: Stripe webhook receiver.
      description: |
        Validates the `Stripe-Signature` header. All other auth bypassed —
        signed payload is the credential.
      responses:
        "200":
          description: received

  /admin/accounts:
    get:
      tags: [Admin]
      summary: List accounts (filterable).
      security: [{ basicAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [active, suspended, cancelled, past_due] }
        - in: query
          name: plan
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
      responses:
        "200": { description: ok }

  /admin/accounts/{id}/suspend:
    post:
      tags: [Admin]
      summary: Suspend an account.
      security: [{ basicAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: suspended }

  /admin/accounts/{id}/reinstate:
    post:
      tags: [Admin]
      summary: Reinstate a suspended account.
      security: [{ basicAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: active }

  /admin/metrics:
    get:
      tags: [Admin]
      summary: Prometheus exposition.
      security: [{ basicAuth: [] }]
      responses:
        "200":
          description: text/plain Prometheus metrics.
          content:
            text/plain:
              schema: { type: string }

webhooks:
  inboundMessage:
    post:
      tags: [Webhooks]
      summary: Inbound WhatsApp message (TextMeFlow → your endpoint).
      description: |
        TextMeFlow POSTs this body to your configured `webhook_url` for every
        inbound WhatsApp message on a paired number. The shape is identical
        to TextMeBot's inbound webhook so existing integrations port 1-to-1.

        ## Authentication
        We sign the raw body with your `webhook_secret` (HMAC-SHA256) and
        send it as `X-TextMeFlow-Signature: sha256=<hex>`. Verify before
        trusting the payload — see https://textmeflow.eu/docs/webhooks
        for verify snippets in PHP / Node / Python.

        ## Idempotency
        `X-TextMeFlow-Event-Id` is stable across retries. Use it to dedupe.

        ## Retries
        Retried up to 5× (backoff 1m, 5m, 30m, 2h, 6h) on 408, 429, 5xx
        and network errors. Other 4xx fail immediately. Timeout is 10 s.
      parameters:
        - in: header
          name: X-TextMeFlow-Event-Id
          required: true
          schema: { type: string, format: uuid }
          description: Stable across retries — use for idempotency.
        - in: header
          name: X-TextMeFlow-Signature
          required: true
          schema: { type: string, example: "sha256=abc123…" }
          description: HMAC-SHA256 of the raw body, prefixed with `sha256=`.
        - in: header
          name: X-TextMeFlow-Delivery
          required: true
          schema: { type: string, format: uuid }
          description: Per-attempt id, useful for log grep.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundMessage'
            examples:
              text:
                summary: Text message
                value:
                  type: text
                  from: "32472932208"
                  from_name: "Jan Janssens"
                  to: "32499123456"
                  file: "null"
                  message: "Bedankt voor de bevestiging!"
              image:
                summary: Image with caption (file URL is "null" until media-rehosting ships)
                value:
                  type: image
                  from: "32472932208"
                  from_name: "Jan Janssens"
                  to: "32499123456"
                  file: "null"
                  message: "Foto van het terras"
      responses:
        "2XX":
          description: Acknowledged. Anything in the 2xx range counts as delivered.
        "401":
          description: Signature mismatch (your endpoint rejected). Will NOT be retried.
        "408":
          description: Timeout — will be retried.
        "429":
          description: Rate-limited — will be retried.
        "5XX":
          description: Server error — will be retried up to 5 times.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: tmf_<hex> (account API key) or tmfc_<40 chars> (connection token)
    basicAuth:
      type: http
      scheme: basic
  schemas:
    ConnectTokenRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, description: The one-time code from the /connect redirect. }
        return: { type: string, format: uri, description: The exact return URL used on /connect. }
        redirect_uri: { type: string, format: uri, description: OAuth2 alias of `return`. }
    WebhookSubscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        event: { type: string, enum: [message.inbound] }
        created_at: { type: string, format: date-time }
    InboundMessage:
      type: object
      description: TextMeBot-compatible inbound-message envelope.
      required: [type, from, from_name, to, file, message]
      properties:
        type:
          type: string
          enum: [text, image, audio, video, document, location]
        from:
          type: string
          description: Sender, digits only (no leading +).
          example: "32472932208"
        from_name:
          type: string
          description: WhatsApp pushName, may be empty.
          example: "Jan Janssens"
        to:
          type: string
          description: Your paired number, digits only.
          example: "32499123456"
        file:
          type: string
          description: |
            Literal string `"null"` for text messages (matches TextMeBot's
            wire shape). Media-URL placeholder for non-text types — actual
            media-rehosting ships in a later release.
          example: "null"
        message:
          type: string
          description: |
            Text body or caption. For `document`, the filename. For
            `location`, the string `"<lat>,<lng>"`.
