name: Günlük tarama ve yayın

on:
  schedule:
    # Her gün 03:15 UTC (KKTC 06:15)
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      models:
        description: "Sadece bu modeller (virgülle, ör. rav4,corolla). Boş = tümü"
        type: string
        default: ""
      commit_site:
        description: "Statik veriyi de commit'le (Cloudflare Pages gibi build'siz hostlar için)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Müzayede lotları
        continue-on-error: true
        run: node src/build-auctions.js

      - name: Tara ve statik site üret
        run: node src/build-static.js ${{ inputs.models && format('--models={0}', inputs.models) || '' }}

      - name: Fiyat geçmişini commit'le
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state-*.json data/reports 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git commit -m "data: fiyat geçmişi $(date -u +%F)"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push && break
            echo "push denemesi $i başarısız, 10 sn sonra tekrar..."
            sleep 10
          done

      - name: Statik veriyi commit'le (opsiyonel)
        if: ${{ inputs.commit_site }}
        continue-on-error: true
        run: |
          git add -f public/data public/reports
          if ! git diff --cached --quiet; then
            git commit -m "site: veri $(date -u +%F)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push denemesi $i başarısız, 10 sn sonra tekrar..."
              sleep 10
            done
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Günlük bildirim
        env:
          NOTIFY_PROVIDER: ${{ vars.NOTIFY_PROVIDER }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXTMEFLOW_APIKEY: ${{ secrets.TEXTMEFLOW_APIKEY }}
          TEXTMEFLOW_TO: ${{ secrets.TEXTMEFLOW_TO }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node src/notify.js
