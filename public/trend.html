<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiyat Trendi · RAV4 Avcısı</title>
<link rel="stylesheet" href="./style.css">
<style>
  .trend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .trend-card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); }
  .trend-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .trend-head h2 { margin: 0; font-size: 15.5px; color: var(--navy); }
  .trend-head .now { font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; }
  .trend-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .delta.up { color: var(--red); font-weight: 700; }
  .delta.down { color: var(--green); font-weight: 700; }
  svg.spark { width: 100%; height: 96px; display: block; margin-top: 10px; }
  .spark .line { fill: none; stroke: var(--steel); stroke-width: 2; }
  .spark .area { fill: rgba(47, 110, 166, .12); }
  .spark .dot { fill: var(--navy); }
  .spark .grid { stroke: #e8eef6; stroke-width: 1; }
  .empty-trend { text-align: center; color: var(--muted); padding: 50px 20px; background: #fff; border: 1px dashed var(--line); border-radius: 16px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-in">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">📈</div>
      <div>
        <h1>Fiyat Trendi</h1>
        <p>Model başına medyan gümrüklü fiyat</p>
      </div>
    </div>
    <div class="top-actions">
      <a class="btn ghost" href="./">← Panele dön</a>
      <a class="btn ghost" href="./auctions.html">Müzayede</a>
      <a class="btn ghost" href="./alerts.html">Alertler</a>
    </div>
  </div>
</header>

<main class="wrap" style="padding-top:24px">
  <p class="muted" style="margin:0 0 16px">
    Her gün kaydedilen medyan gümrüklü fiyat. Veri biriktikçe çizgi uzar; “en düşük” aynı günün en ucuz uygun aracıdır.
  </p>
  <div class="trend-grid" id="grid"></div>
</main>

<footer class="wrap foot">
  <span>Kaynak: günlük taramalar (data/state-*.json)</span>
  <span id="stamp">—</span>
</footer>

<script type="module" src="./trend.js"></script>
</body>
</html>
